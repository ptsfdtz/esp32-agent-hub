[package]
name = "agentdeck-bridge"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
btleplug = "0.11"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
futures = "0.3"
local-ip-address = "0.6"
rpassword = "7.3"
rumqttc = "0.24"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
tokio = { version = "1.0", features = ["rt-multi-thread", "time"] }
uuid = "1.11"

[dev-dependencies]
tempfile = "3.14"
