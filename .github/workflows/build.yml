name: Build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio ziglang pillow
      - run: python -m platformio run
      - run: python tools/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/agentdeck/firmware.bin
            .pio/build/agentdeck/bootloader.bin
            .pio/build/agentdeck/partitions.bin
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test bridge
        run: cargo test --locked --manifest-path bridge/Cargo.toml
      - name: Obtain Mosquitto runtime
        shell: pwsh
        run: |
          Invoke-WebRequest https://mosquitto.org/files/binary/win64/mosquitto-2.1.2-install-windows-x64.exe -OutFile "$env:RUNNER_TEMP/mosquitto.exe"
          $result = Start-Process "$env:RUNNER_TEMP/mosquitto.exe" -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Mosquitto installation failed' }
      - name: Package single executable
        run: ./tools/build-exe.ps1
      - name: Verify packaged executable and recovery
        run: ./tools/check-exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AgentDeck-Windows-x64
          path: build/dist/AgentDeck.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/AgentDeck-Windows-x64/AgentDeck.exe artifacts/firmware/* --repo "$GITHUB_REPOSITORY" --generate-notes
